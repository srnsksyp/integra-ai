
name: PR Linked Issue Verification

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Verify linked issue assignment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # Find linked issue
          ISSUE=$(printf '%s' "$BODY" |
            grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' |
            grep -Eo '[0-9]+' |
            head -n 1 || true)

          if [[ -z "$ISSUE" ]]; then
            echo "No linked issue found."

            gh pr comment "$PR" --repo "$REPO" \
              --body "❌ **Linked issue required**

          Please link your PR to an issue using:

          \`Closes #123\`, \`Fixes #123\`, or \`Resolves #123\`.

          Make sure the issue is assigned to you."

            exit 1
          fi

          # Fetch linked issue
          ISSUE_DATA=$(gh api "repos/$REPO/issues/$ISSUE")

          ISSUE_AUTHOR=$(echo "$ISSUE_DATA" | jq -r '
            [.assignees[].login | ascii_downcase] |
            any(. == ($ENV.AUTHOR | ascii_downcase))
          ')

          if [[ "$ISSUE_AUTHOR" != "true" ]]; then
            ASSIGNEES=$(echo "$ISSUE_DATA" | jq -r '
              [.assignees[].login] | join(", ")
            ')

            gh pr comment "$PR" --repo "$REPO" \
              --body "❌ **Issue Assignment Verification Failed**

          Linked issue: #$ISSUE

          PR author: @$AUTHOR

          Current issue assignee(s): ${ASSIGNEES:-None}

          The PR author must be assigned to the linked issue.

          Please contact the maintainer if you believe this is an error."

            echo "Issue assignment mismatch."
            exit 1
          fi

          echo "Linked issue #$ISSUE is assigned to @$AUTHOR."

          gh pr comment "$PR" --repo "$REPO" \
            --body "✅ **Linked Issue Verification Passed**

          Issue #$ISSUE is assigned to @$AUTHOR.

          Thank you! Your PR can proceed to maintainer review. 🚀"
